aid: buynomics
name: buynomics
description: >-
  Buynomics is a Cologne, Germany-based software company providing an
  AI-powered Revenue Growth Management (RGM) platform for consumer goods,
  retail, telecom, and consumer software companies. Its proprietary "Virtual
  Shoppers AI" runs agent-based simulations of consumer purchasing behavior so
  commercial teams can optimize pricing, promotions, price pack architecture
  (product mix), and trade terms before going to market — capturing cross-
  effects, cannibalization, and competitive response. The platform's Decision
  Guide generates prescriptive recommendations from thousands of evaluated
  scenarios. Buynomics is used by brands including Unilever, Nestle, L'Oreal,
  Danone, General Mills, Vodafone, and Ferrero, and is backed by Insight
  Partners and Seedcamp. The product is delivered as a web application; no
  public developer API, SDK, or API documentation is published at this time.
